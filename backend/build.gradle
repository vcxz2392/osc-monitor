plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.osc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 스키마는 마이그레이션이 만든다. 데이터 적재는 생성기가 따로 한다.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// 테스트가 로컬 MySQL 기동 상태에 의존하지 않도록 컨테이너를 띄운다.
	// 채점자는 docker compose 때문에 어차피 Docker 가 필요하므로 새 전제 조건이 생기지 않는다.
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트가 API 응답시간도 재므로 캐시를 쓰지 않는다.
	// UP-TO-DATE 로 건너뛰면 성능 리포트가 새로 만들어지지 않는다.
	outputs.upToDateWhen { false }
}
