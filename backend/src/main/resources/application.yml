spring:
  application:
    name: monitor
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:monitor}?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&characterEncoding=UTF-8
    username: ${DB_USER:monitor}
    password: ${DB_PASSWORD:monitor}
    hikari:
      maximum-pool-size: 20
      pool-name: monitor-pool
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

logging:
  level:
    com.osc.monitor: INFO
